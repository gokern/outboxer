name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    # Per module, because golangci-lint does not cross a module boundary: a run
    # at the root never sees outboxprom. They share the root .golangci.yaml all
    # the same, which golangci-lint finds by searching upwards, so the two are
    # held to one policy with the differences spelled out there by path.
    strategy:
      fail-fast: false
      matrix:
        module: [".", "outboxprom"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.17 # pinned; bump by hand

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned in mise.toml [tools] — the same install CI and `mise run
          # lint` use locally. Bump it there, on purpose, together with any
          # config/code changes the new version demands.
          install-mode: none
          working-directory: ${{ matrix.module }}

  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    # Both modules, through the mise task that loops them: an untidy nested
    # one is invisible from the root, because go mod tidy does not cross a
    # module boundary either.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.17 # pinned; bump by hand

      - name: Check both go.mod files are tidy
        run: mise run tidy
