name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    # Per module. govulncheck stops at a module boundary like every other Go
    # tool, so a run at the root sees pgx and nothing else — while
    # outboxprom carries client_golang and the seven packages it pulls
    # in, which is now most of the repo's dependency surface by count.
    strategy:
      fail-fast: false
      matrix:
        module: [".", "outboxprom"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.17 # pinned; bump by hand

      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...
