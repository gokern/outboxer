version: 2
updates:
  # One entry for both modules, because Dependabot reads one go.mod per
  # directory and an entry for the root alone never sees outboxprom. Without
  # it client_golang and the seven packages it brings — by count, most of this
  # repo's dependency surface — get no update pull requests, and govulncheck
  # eventually reports a CVE that nothing opens a PR to fix.
  #
  # The two directories are listed together rather than as two entries, which
  # is how this file was first written. outboxprom replaces the root with `..`,
  # so a bump in the root go.mod changes what outboxprom's go.sum has to hold,
  # and a pull request that touches one directory leaves the other untidy and
  # its CI red (#7 was the first). One grouped update bumps and tidies both
  # directories in the same pull request. That holds as long as outboxprom
  # keeps requiring every dependency it shares with the root directly, as its
  # go.mod does today with pgx, panics and testify. goleak is the one
  # exception: only the root's tests use it, yet outboxprom's go.sum records
  # it, so a bump of goleak alone still needs a tidy in outboxprom by hand.
  - package-ecosystem: gomod
    directories: ["/", "/outboxprom"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
