version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gci
    - golines
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default
        # An explicit prefix rather than localmodule: this repo has two modules,
        # and under localmodule gci run from the root calls the parent import
        # local while gci run inside outboxprom — which is how CI lints it —
        # calls the same import third-party, so the two runs rewrite each other
        # forever. Named outright, both agree.
        - prefix(github.com/gokern/outboxer)
    golines:
      max-len: 120 # lll's own default, so the two cannot disagree about a line
    gofmt:
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
        - pattern: "a[b:len(a)]"
          replacement: "a[b:]"

linters:
  default: all
  disable:
    - gomodguard # deprecated; gomodguard_v2 is already on via default: all
    - wsl # deprecated alias of wsl_v5, which default: all still enables
    - wsl_v5 # whitespace cuddling rules are too noisy for this codebase
    - exhaustruct # deprecated; exhaustruct_v5 is already on via default: all
    # This package wraps where an error crosses its API, not where pgx returns
    # one: claim and the other internal helpers pass through, and dispatch adds
    # "outboxer: claim from <table>". wrapcheck cannot see that boundary and
    # flags the helpers, so it is silent here only by accident of asSchemaError
    # standing between the pgx call and the return.
    - wrapcheck

  settings:
    ireturn:
      # The first four are ireturn's own defaults, restated because setting
      # allow at all replaces them; the Option types are sealed interfaces, so
      # a relay setting cannot compile against NewProducer.
      allow:
        - anon
        - error
        - empty
        - stdlib
        - github.com/gokern/outboxer\.RelayOption

    depguard:
      rules:
        # The root module. Its dependency list is the point of the package, so
        # it is spelled out and anything else is a mistake.
        main:
          files:
            - "!**/outboxprom/**"
          allow:
            - $gostd
            - github.com/gokern/outboxer # the package's own test binaries
            - github.com/gokern/panics # the shared recovered-panic type
            - github.com/jackc/pgx/v5 # the module's only external dependency
            - github.com/stretchr/testify # test-only, and stays that way
            - go.uber.org/goleak # test-only, and stays that way

        # outboxprom is a module of its own that exists to depend on one
        # third-party library; that dependency is its whole reason to be, and it
        # never reaches the root go.mod. This config still applies to it, because
        # golangci-lint finds it by searching upwards when run from its
        # directory.
        outboxprom:
          files:
            - "**/outboxprom/**"
          allow:
            - $gostd
            - github.com/gokern/outboxer
            - github.com/gokern/panics # the shared recovered-panic type, for the warning label
            - github.com/jackc/pgx/v5
            - github.com/stretchr/testify
            - github.com/prometheus/client_golang # outboxprom's reason to exist
            - github.com/prometheus/client_model # the protobuf types a Gatherer returns, for assertions


    govet:
      enable-all: true # for shadow, which the default set leaves out
      disable:
        - fieldalignment # padding is not worth reordering the structs over
      settings:
        shadow:
          strict: true

    cyclop:
      package-average: 10.0 # off by default; the per-function limit stays at cyclop's

    varnamelen:
      ignore-names:
        - db # any handle satisfying Execer or Querier, as Insert and NewSampler take
        - i # a range index
        - n # a count, as WithMaxConcurrency takes
        - tc # table-driven case
        - id # a row's primary key
        - fn # the body a with-harness hands its pool to
        - tx # a pgx transaction
        - ch # the channel prometheus.Collector's own interface names this way

    testifylint:
      enable-all: true

    usetesting:
      # Both off upstream; together they enforce t.Context() over a context
      # nothing cancels, which is how a leaked goroutine goes unnoticed.
      context-background: true
      context-todo: true

    revive:
      enable-all-rules: true
      confidence: 0.1
      rules:
        - name: add-constant
          disabled: true # counts 0 and 1 as magic numbers
        - name: line-length-limit
          disabled: true # golines owns the width, at 120 rather than this rule's 80
        - name: cognitive-complexity
          arguments: [10] # 7 by default; dispatch and buildRelayConfig are flat guard sequences
        - name: max-public-structs
          arguments: [7] # 5 by default, counted per file; options.go declares the package's whole option vocabulary: three callback types, the three sealed option interfaces, and TableOption

  exclusions:
    rules:
      # client_golang's option structs carry a dozen optional fields each —
      # eight of them native-histogram settings that are mutually exclusive with
      # the classic Buckets this package sets. Filling them to satisfy the linter
      # would state the opposite of what is meant.
      - path: outboxprom/
        linters:
          - exhaustruct_v5
        text: "prometheus\\.(Counter|Gauge|Histogram|Summary)Opts"

      # A nested module has to build against the working tree, or a change here
      # could not be compiled with the change to the root it depends on. Go
      # ignores a dependency's own replace directives, so it costs an importer
      # nothing — but the require beside it has to name a real version before
      # the module is tagged.
      - path: outboxprom/
        linters:
          - gomoddirectives
        text: "local replacement"

      # revive's names for the three size metrics excluded below.
      - path: _test\.go
        linters:
          - revive
        text: "^(function-length|cognitive-complexity|cyclomatic)"

      - path: _test\.go
        linters:
          - govet
        text: "^shadow" # a subtest redeclares err in its own scope

      - path: _test\.go
        linters:
          - cyclop # a grouped test's branches belong to its subtests
          - err113 # a test builds the error it is about to hand to a callback
          - exhaustruct_v5 # a test fills the fields under test and leaves the rest zero
          - funlen # the table is the test; TestProducer_Insert is 350 lines of it
          - gochecknoglobals # TestMain has to stash the DSN and the embedded DDL somewhere
          - goconst # repeated topic literals ("evt", "user.created") read better inline
          - gocognit # the same branches as cyclop, counted the other way
          - ireturn # a generic test helper returns its type parameter
          - maintidx # driven by the size of the table, not by any complexity in it
          - testableexamples # the examples need a live Postgres, so they are compile-only
